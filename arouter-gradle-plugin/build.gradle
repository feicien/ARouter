apply plugin: 'kotlin'

repositories {
    mavenCentral()
    google()
}

def agpVersion = rootProject.ext.has('agp_version') ? rootProject.ext.get('agp_version') : '8.13.2'

dependencies {
    implementation gradleApi()
//    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"

    // Provides access to the full AGP API, including ScopedArtifact
    compileOnly "com.android.tools.build:gradle-api:$agpVersion"
    compileOnly "com.android.tools.build:gradle:$agpVersion"

    implementation 'commons-io:commons-io:2.11.0'
    implementation 'commons-codec:commons-codec:1.15'
    implementation 'org.ow2.asm:asm:9.2'
    implementation 'org.ow2.asm:asm-commons:9.2'
}

apply from: rootProject.file('gradle/publish.gradle')
