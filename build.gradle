buildscript {
    ext.kotlin_version = '2.0.21'
    ext.arouter_register_version = '1.1.0'

    repositories {
        maven {
            name 'ARouterLocalMaven'
            url "file://${rootProject.projectDir}/localMaven"
        }
        mavenCentral()
        google()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "com.alibaba:arouter-register:$arouter_register_version"
    }
}

allprojects {
    repositories {
        maven {
            name 'ARouterLocalMaven'
            url "file://${rootProject.projectDir}/localMaven"
        }
        mavenCentral()
        google()
    }
}
